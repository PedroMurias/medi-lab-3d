<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Gran Repte · Medi·Lab 6è</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#f5b62e;--gold2:#ffd76a;--bar1:#1c1a6e;--bar2:#3a2fa8;--line:#c9cdf2;--ok:#2fd26b;--ko:#e8443a;--sel:#f39a1c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#090426;color:#fff;font-family:'Space Grotesk',system-ui,sans-serif}
#bg{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%,#4b2fc9 0%,#2a1585 28%,#120a4d 58%,#05021e 100%)}
#bg::after{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 32%,rgba(255,255,255,.035) 0 6deg,transparent 6deg 12deg);animation:spin 120s linear infinite;mask:radial-gradient(circle at 50% 32%,#000 0,transparent 70%)}
@keyframes spin{to{transform:rotate(360deg)}}
#app{position:relative;height:100%;display:flex;flex-direction:column}
/* capçalera i comodins */
#topbar{display:flex;align-items:center;gap:10px;padding:12px 16px 0 72px}
.life{width:84px;height:52px;border-radius:50%;border:3px solid #dfe3ff;background:radial-gradient(ellipse at 50% 30%,#4c49d8,#1d1a7a);display:flex;align-items:center;justify-content:center;font:700 18px 'Space Grotesk',system-ui,sans-serif;color:#fff;cursor:pointer;box-shadow:0 0 14px rgba(120,120,255,.5);transition:transform .15s,opacity .3s}
.life:hover{transform:scale(1.07)}
.life.used{opacity:.25;cursor:default;transform:none;position:relative}
.life.used::after{content:"";position:absolute;width:70%;height:4px;background:var(--ko);transform:rotate(-30deg);border-radius:2px}
.life svg{width:30px;height:30px;fill:#fff}
#sp{flex:1}
#scoreTop{font:700 16px 'Space Grotesk',system-ui,sans-serif;white-space:nowrap;color:var(--gold2);padding:6px 14px;border-radius:20px;border:2px solid rgba(255,215,106,.5);background:rgba(0,0,0,.25)}
/* centre */
#stage{flex:1;display:flex;min-height:0}
#mainCol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 18px 22px;min-width:0}
#logo{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;width:100%}
#logo svg{height:min(36vh,300px);width:auto;filter:drop-shadow(0 0 30px rgba(130,110,255,.75))}
/* barres hexagonals */
.hexrow{position:relative;width:100%;max-width:1100px}
.hexrow::before{content:"";position:absolute;left:-30px;right:-30px;top:50%;height:3px;background:linear-gradient(90deg,transparent,var(--line) 8%,var(--line) 92%,transparent);z-index:0}
.hex{position:relative;z-index:1;clip-path:polygon(4% 0,96% 0,100% 50%,96% 100%,4% 100%,0 50%);background:var(--line);padding:3px}
.hex>div{clip-path:polygon(4% 0,96% 0,100% 50%,96% 100%,4% 100%,0 50%);background:linear-gradient(180deg,var(--bar2),var(--bar1) 55%,#120f55);display:flex;align-items:center;justify-content:center;text-align:center}
#qbar .hex>div{min-height:92px;padding:12px 7%;font-size:clamp(17px,2.4vw,27px);font-weight:700;line-height:1.25}
#answers{display:grid;grid-template-columns:1fr 1fr;gap:12px 26px;width:100%;max-width:1100px;margin-top:14px}
.ans{cursor:pointer}
.ans .hex>div{min-height:58px;justify-content:flex-start;padding:8px 7%;font-size:clamp(15px,2vw,22px);font-weight:700;text-align:left}
.ans b{color:var(--gold);margin-right:8px}
.ans:hover .hex>div{background:linear-gradient(180deg,#4f43d0,#25208f)}
.ans.sel .hex>div{background:linear-gradient(180deg,#ffb347,var(--sel) 55%,#c46d00);color:#1a0b00}
.ans.sel b{color:#3a1800}
.ans.ok .hex>div{background:linear-gradient(180deg,#6cf09a,var(--ok) 55%,#159a46);color:#032010;animation:blink .35s 4}
.ans.ok b{color:#032010}
.ans.ko .hex>div{background:linear-gradient(180deg,#ff7a6e,var(--ko) 55%,#9b1e16)}
.ans.gone{visibility:hidden}
@keyframes blink{50%{filter:brightness(1.6)}}
#qimg{display:none;max-height:min(30vh,260px);max-width:min(460px,80vw);border-radius:16px;border:3px solid var(--line);box-shadow:0 0 30px rgba(110,90,255,.6);object-fit:cover;background:#000}
#mainCol.img #logo{display:none}#mainCol.img #qimg{display:block;margin:auto 0 6px}
#qnum{margin:8px 0 2px;color:var(--gold2);font-weight:700;font-size:15px;letter-spacing:.06em}
#confirm{margin-top:12px;display:none;gap:10px}
.btn{border:2px solid #dfe3ff;border-radius:30px;background:linear-gradient(180deg,#5a54e6,#2a2496);color:#fff;font:700 17px 'Space Grotesk',system-ui,sans-serif;padding:10px 24px;cursor:pointer}
.btn:hover{filter:brightness(1.15)}
.btn.gold{background:linear-gradient(180deg,#ffd76a,#e09a12);color:#2a1500;border-color:#fff3c4}
.btn.ghost{background:transparent}
/* escala de punts */
#ladder{width:230px;padding:10px 12px 22px;display:flex;flex-direction:column-reverse;gap:2px;font-weight:700;font-size:15px}
#ladder div{display:flex;gap:10px;padding:3px 12px;border-radius:12px;color:var(--gold)}
#ladder div span:first-child{width:22px;text-align:right;opacity:.85}
#ladder div.safe{color:#fff}
#ladder div.cur{background:var(--gold);color:#1a0b00}
#ladder div.done{opacity:.5}
/* finestres */
.ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(5,2,30,.78);backdrop-filter:blur(3px)}
.ov.show{display:flex}
.card{width:min(760px,94vw);max-height:92vh;overflow:auto;padding:24px 26px;border-radius:24px;background:linear-gradient(180deg,#2d2499,#140f5c);border:3px solid var(--line);box-shadow:0 0 50px rgba(110,90,255,.6);text-align:center}
.card h1{font-family:Orbitron,system-ui,sans-serif;font-weight:900;color:var(--gold2);letter-spacing:.06em;margin:4px 0 6px;font-size:clamp(26px,5vw,40px);text-shadow:0 0 18px rgba(255,200,80,.6)}
.card h2{color:var(--gold2);margin:4px 0 10px}
.card p{color:#e1e4ff;line-height:1.45;margin:8px 0}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:14px 0}
.u{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;border:2px solid rgba(201,205,242,.45);background:rgba(0,0,0,.25);cursor:pointer;font-weight:700;text-align:left}
.u.on{border-color:var(--gold);background:rgba(245,182,46,.18)}
.u small{display:block;font-weight:500;opacity:.7;font-size:12px}
.u .e{font-size:24px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
input#nom{font:600 17px 'Space Grotesk',system-ui,sans-serif;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:rgba(0,0,0,.3);color:#fff;width:min(320px,90%);text-align:center}
#expl{margin:14px auto 0;max-width:1100px;width:100%;display:none;padding:12px 18px;border-radius:16px;background:rgba(0,0,0,.45);border:2px solid rgba(201,205,242,.5);font-size:16px;line-height:1.4;text-align:left}
#expl b{color:var(--gold2)}
#expl .row{justify-content:flex-end;margin-top:8px}
/* públic */
.bars{display:flex;gap:18px;justify-content:center;align-items:flex-end;height:200px;margin:12px 0}
.bars div{width:56px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-weight:700}
.bars i{display:block;width:100%;background:linear-gradient(180deg,var(--gold2),#d98a0a);border-radius:6px 6px 0 0;transition:height 1.2s}
.bars span{margin-top:6px;color:var(--gold)}
#rec{font-size:14px;opacity:.8}
@media (max-width:860px){#ladder{display:none}#answers{grid-template-columns:1fr;gap:8px}.life{width:64px;height:42px;font-size:15px}.life svg{width:24px;height:24px}#logo svg{height:22vh}#qbar .hex>div{min-height:74px}.ans .hex>div{min-height:48px}}
</style>
</head>
<body>
<div id="bg"></div>
<div id="app">
 <div id="topbar">
  <div class="life" id="l50" title="50:50 · elimina dues respostes incorrectes">50:50</div>
  <div class="life" id="lPub" title="Pregunta al públic"><svg viewBox="0 0 24 24"><circle cx="6" cy="8" r="2.4"/><circle cx="12" cy="7" r="2.8"/><circle cx="18" cy="8" r="2.4"/><path d="M1.5 18c0-3 2-5 4.5-5s4.5 2 4.5 5zM7 18.5c0-3.5 2.3-5.8 5-5.8s5 2.3 5 5.8zM13.5 18c0-3 2-5 4.5-5s4.5 2 4.5 5z"/></svg></div>
  <div class="life" id="lTel" title="Truca a un amic"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg></div>
  <div id="sp"></div>
  <button class="btn ghost" id="bPlant" title="Planta't i queda't els punts">✋ Em planto</button>
  <div id="scoreTop">0 punts</div>
 </div>
 <div id="stage">
  <div id="mainCol">
   <div id="logo"><svg viewBox="0 0 300 300" aria-label="El Gran Repte">
    <defs><radialGradient id="lg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#2c63c9"/><stop offset=".7" stop-color="#14237a"/><stop offset="1" stop-color="#0b0d45"/></radialGradient><linearGradient id="gd" x1="0" x2="1"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".5" stop-color="#f5b62e"/><stop offset="1" stop-color="#b9780c"/></linearGradient><path id="arcT" d="M45 150a105 105 0 0 1 210 0"/><path id="arcB" d="M40 150a110 110 0 0 0 220 0"/></defs>
    <circle cx="150" cy="150" r="146" fill="#1a0f5e" stroke="#c9cdf2" stroke-width="3"/>
    <circle cx="150" cy="150" r="122" fill="url(#lg)" stroke="url(#gd)" stroke-width="5"/>
    <g id="rays" stroke="url(#gd)" stroke-width="4" fill="none" stroke-linecap="round"></g>
    <circle cx="150" cy="150" r="40" fill="#0d1460" stroke="url(#gd)" stroke-width="3"/>
    <text x="150" y="146" text-anchor="middle" font-family="Orbitron" font-weight="900" font-size="15" fill="#ffd76a">MEDI</text><text x="150" y="165" text-anchor="middle" font-family="Orbitron" font-weight="900" font-size="15" fill="#ffd76a">LAB</text>
    <text font-family="Orbitron" font-weight="900" font-size="20" fill="#fff" letter-spacing="3"><textPath href="#arcT" startOffset="50%" text-anchor="middle">EL GRAN REPTE</textPath></text>
    <text font-family="Orbitron" font-weight="700" font-size="13" fill="#ffd76a" letter-spacing="4"><textPath href="#arcB" startOffset="50%" text-anchor="middle">· CONEIXEMENT DEL MEDI ·</textPath></text>
   </svg></div>
   <img id="qimg" alt=""><div id="qnum"></div>
   <div class="hexrow" id="qbar"><div class="hex"><div id="qtxt">Prepara't!</div></div></div>
   <div id="answers"></div>
   <div id="confirm" class="row"><button class="btn gold" id="bOk">✅ És la meva resposta definitiva</button><button class="btn ghost" id="bNo">Canviar</button></div>
   <div id="expl"></div>
  </div>
  <div id="ladder"></div>
 </div>
</div>
<!-- inici -->
<div class="ov show" id="ovStart"><div class="card">
 <h1>EL GRAN REPTE</h1>
 <p>15 preguntes de Coneixement del Medi, de fàcils a difícils. Encerta-les totes per arribar al <b>1.000.000 de punts</b>! Tens tres comodins i et pots plantar quan vulguis.</p>
 <input id="nom" placeholder="El teu nom" maxlength="20">
 <h2 style="margin-top:16px">De quines unitats vols les preguntes?</h2>
 <div class="units" id="uGrid"></div>
 <div class="row"><button class="btn ghost" id="bAll">Totes</button><button class="btn ghost" id="bNone">Cap</button></div>
 <p id="poolInfo" style="font-size:14px;opacity:.8"></p>
 <div class="row"><button class="btn gold" id="bGo" style="font-size:20px;padding:12px 30px">▶ Comença el repte</button></div>
 <p id="rec"></p>
</div></div>
<!-- públic / amic -->
<div class="ov" id="ovHelp"><div class="card"><h2 id="hT"></h2><div id="hB"></div><div class="row"><button class="btn gold" id="hX">D'acord</button></div></div></div>
<!-- final -->
<div class="ov" id="ovEnd"><div class="card"><h1 id="eT"></h1><p id="eB" style="font-size:18px"></p><div class="row"><button class="btn gold" id="eAgain">🔁 Torna a jugar</button><button class="btn ghost" id="eUnits">Canvia d'unitats</button></div><p id="eRec"></p></div></div>
<script>/*REPTEQ*/</script>
<script>/*REPTEIMG*/</script>
<script>
(()=>{
const $=s=>document.querySelector(s);
const PR=[100,200,300,500,1000,2000,4000,8000,16000,32000,64000,125000,250000,500000,1000000];
const fmt=n=>n.toLocaleString('ca-ES');
const L='ABCD';
/* raigs del logo */
{ const g=$('#rays'); let h=''; for(let i=0;i<12;i++){ const a=i/12*Math.PI*2; const x1=150+Math.cos(a)*44,y1=150+Math.sin(a)*44,x2=150+Math.cos(a+.5)*112,y2=150+Math.sin(a+.5)*112,cx=150+Math.cos(a+.05)*90,cy=150+Math.sin(a+.05)*90; h+=`<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}"/>`; } g.innerHTML=h; }
/* so (sense fitxers) */
let AC=null; const tone=(f,d,t='sine',v=.12,dl=0)=>{ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(),g=AC.createGain(); o.type=t; o.frequency.value=f; g.gain.setValueAtTime(0,AC.currentTime+dl); g.gain.linearRampToValueAtTime(v,AC.currentTime+dl+.02); g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dl+d); o.connect(g).connect(AC.destination); o.start(AC.currentTime+dl); o.stop(AC.currentTime+dl+d+.05);}catch(e){} };
const sOk=()=>{ [523,659,784,1047].forEach((f,i)=>tone(f,.35,'triangle',.14,i*.11)); }, sKo=()=>{ tone(220,.6,'sawtooth',.08); tone(165,.8,'sawtooth',.08,.25); }, sSus=()=>{ tone(110,1.4,'sine',.1); tone(116,1.4,'sine',.06); }, sSel=()=>tone(440,.12,'square',.05);
/* unitats */
const ST={units:new Set(RUNITS.map(u=>u[0])),name:''};
try{ const s=JSON.parse(localStorage.getItem('medilab_repte')||'{}'); if(s.units) ST.units=new Set(s.units); if(s.name) ST.name=s.name; }catch(e){}
$('#nom').value=ST.name;
function drawUnits(){ $('#uGrid').innerHTML=RUNITS.map(([n,e,t])=>{ const c=RQ.filter(q=>q[0]===n).length; return `<div class="u ${ST.units.has(n)?'on':''}" data-u="${n}"><span class="e">${e}</span><span>${t}<small>Unitat ${n===9?'9':n} · ${c} preguntes</small></span></div>`; }).join(''); document.querySelectorAll('.u').forEach(d=>d.onclick=()=>{ const n=+d.dataset.u; ST.units.has(n)?ST.units.delete(n):ST.units.add(n); drawUnits(); }); const c=RQ.filter(q=>ST.units.has(q[0])).length; $('#poolInfo').textContent=ST.units.size?`${c} preguntes disponibles${c<15?' · amb menys de 15 preguntes el repte serà més curt':''}`:'Tria com a mínim una unitat'; $('#bGo').disabled=!ST.units.size; $('#bGo').style.opacity=ST.units.size?1:.4; }
$('#bAll').onclick=()=>{ ST.units=new Set(RUNITS.map(u=>u[0])); drawUnits(); }; $('#bNone').onclick=()=>{ ST.units.clear(); drawUnits(); };
drawUnits();
const recs=()=>{ try{ return JSON.parse(localStorage.getItem('medilab_repte_rec')||'[]'); }catch(e){ return []; } };
const showRec=el=>{ const r=recs().slice(0,3); el.innerHTML=r.length?'🏆 Rècords: '+r.map(x=>`${x.n||'Anònim'} ${fmt(x.p)}`).join(' · '):''; };
showRec($('#rec'));
/* partida */
let G=null;
const shuffle=a=>{ for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };
function newGame(){
 ST.name=$('#nom').value.trim(); try{ localStorage.setItem('medilab_repte',JSON.stringify({units:[...ST.units],name:ST.name})); }catch(e){}
 const pool=RQ.filter(q=>ST.units.has(q[0])); const byL=[1,2,3].map(l=>shuffle(pool.filter(q=>q[1]===l)));
 const n=Math.min(15,pool.length); const want=i=>i<n/3?0:i<n*2/3?1:2; const qs=[];
 for(let i=0;i<n;i++){ let l=want(i); const order=[l,l===0?1:l-1,l===2?1:l+1,0,1,2]; for(const k of order){ if(byL[k]&&byL[k].length){ qs.push(byL[k].pop()); break; } } }
 const prize=PR.slice(15-n); const safe=[Math.round(n/3)-1,Math.round(n*2/3)-1];
 G={qs,prize,safe,i:0,sel:-1,life:{l50:1,lPub:1,lTel:1},removed:new Set(),locked:false};
 ['l50','lPub','lTel'].forEach(k=>$('#'+k).classList.remove('used'));
 $('#ovStart').classList.remove('show'); $('#ovEnd').classList.remove('show'); drawLadder(); ask();
}
function drawLadder(){ $('#ladder').innerHTML=G.prize.map((p,i)=>`<div class="${G.safe.includes(i)?'safe':''} ${i===G.i?'cur':''} ${i<G.i?'done':''}"><span>${i+1}</span><span>◆ ${fmt(p)}</span></div>`).join(''); $('#scoreTop').textContent=fmt(G.i?G.prize[G.i-1]:0)+' punts'; }
function ask(){ const q=G.qs[G.i]; G.sel=-1; G.locked=false; G.removed=new Set(); G.order=shuffle([0,1,2,3]);
 $('#qnum').textContent=`Pregunta ${G.i+1} de ${G.qs.length} · per ${fmt(G.prize[G.i])} punts · ${RUNITS.find(u=>u[0]===q[0])[1]} ${RUNITS.find(u=>u[0]===q[0])[2]}`;
 $('#qtxt').textContent=q[2]; const im=q[5]&&window.RQIMG&&RQIMG[q[5]]; $('#mainCol').classList.toggle('img',!!im); if(im){ $('#qimg').src=im; $('#qimg').alt=q[2]; }
 $('#answers').innerHTML=G.order.map((o,k)=>`<div class="ans hexrow" data-k="${k}"><div class="hex"><div><b>${L[k]}:</b> ${q[3][o]}</div></div></div>`).join('');
 document.querySelectorAll('.ans').forEach(a=>a.onclick=()=>pick(+a.dataset.k));
 $('#confirm').style.display='none'; $('#expl').style.display='none'; $('#bPlant').style.display=G.i?'':'none'; drawLadder(); }
function pick(k){ if(G.locked||G.removed.has(k)) return; G.sel=k; sSel(); document.querySelectorAll('.ans').forEach(a=>a.classList.toggle('sel',+a.dataset.k===k)); $('#confirm').style.display='flex'; }
$('#bNo').onclick=()=>{ G.sel=-1; document.querySelectorAll('.ans').forEach(a=>a.classList.remove('sel')); $('#confirm').style.display='none'; };
const correctK=()=>G.order.indexOf(0);
$('#bOk').onclick=()=>{ if(G.sel<0||G.locked) return; G.locked=true; $('#confirm').style.display='none'; sSus();
 setTimeout(()=>{ const ok=G.sel===correctK(), q=G.qs[G.i]; const A=document.querySelectorAll('.ans'); A[correctK()].classList.remove('sel'); A[correctK()].classList.add('ok'); if(!ok) A[G.sel].classList.replace('sel','ko');
  ok?sOk():sKo(); const last=G.i===G.qs.length-1;
  $('#expl').innerHTML=`<b>${ok?'✅ Correcte!':'❌ Oh, no!'}</b> ${q[4]}<div class="row">${ok?(last?'<button class="btn gold" id="xN">🏆 Veure el resultat</button>':'<button class="btn gold" id="xN">Següent pregunta ▶</button>'):'<button class="btn gold" id="xN">Veure el resultat</button>'}</div>`; $('#expl').style.display='block';
  $('#xN').onclick=()=>{ if(!ok) return end(false); G.i++; if(G.i>=G.qs.length) return end(true,true); ask(); };
 },1600); };
/* comodins */
function use(k){ if(!G||G.locked||!G.life[k]) return false; G.life[k]=0; $('#'+k).classList.add('used'); return true; }
$('#l50').onclick=()=>{ if(!use('l50')) return; const wrong=shuffle([0,1,2,3].filter(k=>k!==correctK())).slice(0,2); wrong.forEach(k=>{ G.removed.add(k); document.querySelectorAll('.ans')[k].classList.add('gone'); if(G.sel===k){ G.sel=-1; $('#confirm').style.display='none'; } }); tone(660,.2,'triangle',.1); };
const lvl=()=>G.qs[G.i][1];
$('#lPub').onclick=()=>{ if(!use('lPub')) return; const c=correctK(), alive=[0,1,2,3].filter(k=>!G.removed.has(k)); const base=[.0,.72,.55,.42][lvl()]+Math.random()*.15; const v={}; let rest=1-base; v[c]=base; const others=alive.filter(k=>k!==c); others.forEach((k,i)=>{ const x=i===others.length-1?rest:rest*Math.random(); v[k]=x; rest-=x; });
 $('#hT').textContent='📊 El públic ha votat'; $('#hB').innerHTML=`<div class="bars">${[0,1,2,3].map(k=>`<div><small>${Math.round((v[k]||0)*100)}%</small><i style="height:0" data-h="${(v[k]||0)*100}"></i><span>${L[k]}</span></div>`).join('')}</div>`; $('#ovHelp').classList.add('show'); setTimeout(()=>document.querySelectorAll('.bars i').forEach(i=>i.style.height=i.dataset.h*1.7+'px'),60); };
const FR=['la Laia','en Pau','la iaia Montse','en Jordi','la mestra Núria','l\'Arnau'];
$('#lTel').onclick=()=>{ if(!use('lTel')) return; const c=correctK(); const sure=[0,.92,.78,.62][lvl()]; const alive=[0,1,2,3].filter(k=>!G.removed.has(k)); const say=Math.random()<sure?c:shuffle(alive.filter(k=>k!==c))[0]; const who=FR[Math.random()*FR.length|0];
 const conf=say===c?(lvl()===1?'Segur que':'Crec que'):'Uf, no ho sé... potser'; $('#hT').textContent='📞 Truques a '+who; $('#hB').innerHTML=`<p style="font-size:20px">«${conf} és la <b style="color:var(--gold2)">${L[say]}</b>: ${G.qs[G.i][3][G.order[say]]}.»</p><p style="font-size:14px;opacity:.75">Els amics a vegades s'equivoquen, sobretot amb les preguntes difícils!</p>`; $('#ovHelp').classList.add('show'); tone(880,.1,'square',.05); tone(880,.1,'square',.05,.2); };
$('#hX').onclick=()=>$('#ovHelp').classList.remove('show');
$('#bPlant').onclick=()=>{ if(!G||G.locked||!G.i) return; end(true,false,true); };
/* final */
function end(win,all,plant){ G.locked=true; let pts=0, t='', b='';
 if(all){ pts=G.prize[G.prize.length-1]; t='🏆 HAS GUANYAT!'; b=`Has encertat totes les preguntes: <b>${fmt(pts)} punts</b>. Ets una persona experta en Coneixement del Medi!`; [523,659,784,1047,1319].forEach((f,i)=>tone(f,.5,'triangle',.14,i*.15)); }
 else if(plant){ pts=G.prize[G.i-1]; t='✋ T\'has plantat'; b=`Et quedes amb <b>${fmt(pts)} punts</b>. Has respost bé ${G.i} preguntes.`; }
 else { const s=G.safe.filter(x=>x<G.i).pop(); pts=s===undefined?0:G.prize[s]; t='Fi del repte'; b=`Has encertat ${G.i} preguntes. ${pts?`Gràcies al punt segur, et quedes <b>${fmt(pts)} punts</b>.`:'Aquesta vegada no t\'emportes punts, però has après coses noves!'}`; }
 try{ const r=recs(); r.push({n:ST.name,p:pts,d:Date.now()}); r.sort((a,b)=>b.p-a.p); localStorage.setItem('medilab_repte_rec',JSON.stringify(r.slice(0,10))); }catch(e){}
 $('#eT').textContent=t; $('#eB').innerHTML=b; showRec($('#eRec')); $('#ovEnd').classList.add('show'); $('#scoreTop').textContent=fmt(pts)+' punts'; }
$('#bGo').onclick=newGame; $('#eAgain').onclick=newGame; $('#eUnits').onclick=()=>{ $('#ovEnd').classList.remove('show'); drawUnits(); showRec($('#rec')); $('#ovStart').classList.add('show'); };
addEventListener('keydown',e=>{ if(!G||G.locked||document.querySelector('.ov.show')) return; const k='abcd'.indexOf(e.key.toLowerCase()); if(k>=0) pick(k); if(e.key==='Enter'&&G.sel>=0) $('#bOk').click(); });
window.__r={newGame,ask,get G(){return G}};
})();
