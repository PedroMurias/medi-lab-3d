 function applyLite(on){ lite=on; try{ localStorage.setItem('mlLite',on?'1':'0'); }catch(e){} var b=document.getElementById('mlLite'); if(b){ b.classList.toggle('on',on); b.textContent=on?'🐢 Mode lleuger: sí':'⚡ Mode lleuger'; }
  if(!R) return; R.__ppr=R.__ppr||R.getPixelRatio(); R.setPixelRatio(on?Math.min(1,R.__ppr)*0.75:R.__ppr); R.shadowMap.enabled=!on; try{ var c=R.domElement; if(c.clientWidth>0&&c.clientHeight>0) R.setSize(c.clientWidth,c.clientHeight,false); }catch(e){}
  if(S) S.traverse(function(o){ if(o.isLight&&o.castShadow!==undefined){ if(on){ o.userData.__cs=o.castShadow; o.castShadow=false; } else if(o.userData.__cs!=null) o.castShadow=o.userData.__cs; } if(o.material){ (Array.isArray(o.material)?o.material:[o.material]).forEach(function(m){ m.needsUpdate=true; }); } }); }
